# Replace namespace demo and bind the account used by the external SRK agent.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: srk-backup
  namespace: demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: srk-backup
  namespace: demo
rules:
  - apiGroups: [""]
    resources: [configmaps, services, serviceaccounts, persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshots]
    verbs: [create, get]
# To enable include_secrets, explicitly add get/list for core resource secrets.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: srk-backup
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: srk-backup
    namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: srk-backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: srk-backup-volume-reader
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [demo]
    verbs: [get]
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotcontents]
    verbs: [get]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotclasses]
    resourceNames: [lh-backup]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: srk-backup-volume-reader
subjects:
  - kind: ServiceAccount
    name: srk-backup
    namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: srk-backup-volume-reader
---
# Requires Longhorn CSI, snapshot CRDs/controller and a configured backup target.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: lh-backup
driver: driver.longhorn.io
deletionPolicy: Retain
parameters:
  type: bak
