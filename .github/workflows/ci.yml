name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: srk
          POSTGRES_PASSWORD: srk-ci-test-only
          POSTGRES_DB: srk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U srk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SRK_TEST_DATABASE_URL: postgres://srk:srk-ci-test-only@127.0.0.1:5432/srk_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
  altlinux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Prepare ALT p10 build and test environment
        run: docker build --progress=plain -t srk-altlinux10-builder - < packaging/altlinux/Dockerfile
      - run: make altlinux
        env:
          ALT_IMAGE: srk-altlinux10-builder
      - name: Install and smoke test RPM on ALT p10
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD/dist:/dist:ro" srk-altlinux10-builder sh -ec '
            apt-get install -y /dist/*.rpm
            srk version
            srk dev init --dir /tmp/srk-smoke
            for role in manager media agent proxy; do
              srk --config /tmp/srk-smoke/$role.json $role check-config
            done
          '
      - uses: actions/upload-artifact@v4
        with:
          name: gdata-srk-altlinux10-x86_64
          path: dist/*
